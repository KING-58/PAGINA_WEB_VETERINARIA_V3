<div class="servicios-container">
  <h2 class="titulo">Nuestros Servicios</h2>
  <div class="grid">
    <div class="card" *ngFor="let s of servicios">
      <div class="icono">
        <i [class]="s.icono"></i>
      </div>
      <h3>{{ s.nombre }}</h3>
      <p>{{ s.descripcion }}</p>
      <button class="btn-reservar">Reservar Ahora</button>
    </div>
  </div>
</div>
