<!-- ENCABEZADO + BUSCADOR -->
<div class="productos-header">
  <h2>NUESTROS PRODUCTOS</h2>

  <div class="search-bar">
    <input
      type="text"
      [(ngModel)]="terminoBusqueda"
      placeholder="🔍 Buscar productos..."
    >
  </div>
</div>

<div class="filtros">
  <button
    *ngFor="let cat of categorias"
    [class.active]="categoriaActiva === cat.nombre"
    (click)="cambiarCategoria(cat.nombre)">
    {{cat.icono}} {{cat.nombre}}
  </button>
</div>

<div class="productos-grid">
  <!-- TARJETAS -->
  <div class="card" *ngFor="let p of productosFiltrados">
    <img [src]="p.imagen" [alt]="p.nombre">
    <div class="card-content">
      <h3>{{ p.nombre }}</h3>
      <p>{{ p.descripcion }}</p>
      <span class="precio">\${{ p.precio }}</span>
      <button>Agregar al Carrito</button>
    </div>
  </div>

  <!-- MENSAJE SI NO HAY RESULTADOS -->
  <div class="no-resultados" *ngIf="productosFiltrados.length === 0">
    😿 Producto no encontrado. Intenta con otro nombre o categoría.
  </div>
</div>
