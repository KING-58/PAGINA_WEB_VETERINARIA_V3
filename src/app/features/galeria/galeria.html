<h2>NUESTRO TRABAJO</h2>
<div class="galeria-grid">
  <div *ngFor="let trabajo of trabajos" class="card">
    <img *ngIf="!trabajo.video" [src]="trabajo.imagen" [alt]="trabajo.titulo">
    <video *ngIf="trabajo.video" controls>
      <source [src]="trabajo.imagen" type="video/mp4">
      Tu navegador no soporta videos.
    </video>
    <p>{{ trabajo.titulo }}</p>
  </div>
</div>
